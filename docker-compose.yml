version: '3.8'

services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'donjonDragon', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >-
        echo "try { rs.status().ok } catch (error) {
        rs.initiate({_id:'donjonDragon',members:[{_id:0,host:'mongo:27017'}]}).ok
        }" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/donjon-dragon?replicaSet=donjonDragon&directConnection=true
      JWT_SECRET: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
